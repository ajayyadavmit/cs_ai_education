name: CS and AI Education Digest

on:
  schedule:
    # 00:15 UTC = 06:00 Nepal time
    - cron: "15 0 * * *"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cs-ai-education-digest
  cancel-in-progress: false

jobs:
  build-digest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build article digest
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.5-flash-lite
        run: |
          python scripts/build_digest.py

      - name: Commit updated digest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add cs-ai-education-digest.html data/articles.json

          if ! git diff --cached --quiet; then
            git commit -m "Update CS and AI Education Digest"
            git push
          else
            echo "No changes to publish."
          fi
